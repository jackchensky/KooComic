name: 错误反馈 / Bug report
description: 报告可重复出现的插件问题，并提供不含敏感信息的环境资料。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿填写 KOOBONE 密码、Cookie、账号、完整签名下载地址，上传截图前请遮盖个人信息。

  - type: input
    id: device
    attributes:
      label: Kindle / 设备型号
      description: 例如 Kindle Paperwhite 3；不知道时可填写设备昵称或大致年份。
      placeholder: Kindle Paperwhite 3
    validations:
      required: true

  - type: input
    id: koreader_version
    attributes:
      label: KOReader 版本
      placeholder: 例如 2026.08
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: Koo可漫版本
      placeholder: 例如 v0.4.0
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: 安装或更新方式
      options:
        - Storefront
        - 手动复制插件目录
        - 插件内在线更新
        - 不确定
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 请说明发生了什么，以及你原本期望看到什么。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: sanitized_logs
    attributes:
      label: 已脱敏的错误或日志
      description: 只粘贴相关几行；删除账号、密码、Cookie、会话值和完整签名 URL。没有时填写“无”。
      render: text

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已经完全重启 KOReader，并确认问题仍然存在。
          required: true
        - label: 我已检查截图和日志，不包含账号、密码、Cookie、会话值或完整签名下载地址。
          required: true
        - label: 我已搜索现有 Issue，没有找到同一问题。
          required: true
